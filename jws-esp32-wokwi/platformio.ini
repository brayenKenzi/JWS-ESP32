[platformio]
default_envs = sim

[env:sim]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_dashboard.py
lib_deps =
  adafruit/Adafruit BusIO@1.17.0
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ILI9341@1.6.2
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -DJWS_SIMULATION=1
  -Wall
  -Wextra

[env:sim_mock]
extends = env:sim
build_flags =
  ${env:sim.build_flags}
  -DJWS_MOCK_CLOCK=1

[env:hd_wf2]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_dashboard.py
lib_deps =
  adafruit/Adafruit BusIO@1.17.0
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ILI9341@1.6.2
  bblanchon/ArduinoJson@6.21.5
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
build_flags =
  -DJWS_HD_WF2_HUB75=1
  -Wall
  -Wextra

[env:hd_wf2_s3]
extends = env:hd_wf2
board = esp32-s3-devkitc-1
build_flags =
  ${env:hd_wf2.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:desktop_s3_tft]
extends = env:sim
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
lib_deps =
  ${env:sim.lib_deps}
  sinricpro/SinricPro@^2.10.0
  fbiego/ChronosESP32@^1.9.1
build_flags =
  ${env:sim.build_flags}
  -DJWS_DESKTOP_S3=1
  -DBOARD_HAS_PSRAM

